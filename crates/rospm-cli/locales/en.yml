  no_workspaces: "at least one [workspaces.<name>] is required"
  self_underlay: "workspace `%{name}` lists itself as an underlay"
  unknown_underlay: "workspace `%{name}` references unknown underlay `%{underlay}`"
  target_not_listed: "target.%{key} is declared but `%{key}` is not listed in project.platforms"
  target_unknown_platform: "target.%{key}: unknown platform (expected one of: linux-x86_64, linux-aarch64)"
  env_reserved: "env.%{key} is derived from the workspace overlay order and must not be set manually"
