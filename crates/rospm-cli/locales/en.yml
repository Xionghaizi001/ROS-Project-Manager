# rospm user-facing text, English (source language). See docs/spec.md §4.2.
# Keys are namespaced: cli.* (CLI layer), error.* / manifest.* / plan.* /
# native.* / probe.* / init.* / draft.* / tool.* (produced by rospm-core as
# message keys). Placeholders use %{name}. Every key must also exist in
# zh-CN.yml (tests/i18n.rs checks this); `_test.*` keys are exempt.

_test:
  en_only: "english only"

repository:
  header: "Repository package availability (%{platform})"
  ready: "All checked package names are available in target indexes"
  not_ready: "Repository check incomplete: %{summary}"
  available: "Available in target repository indexes"
  found: "Found for %{platform}"
  missing: "Not found for %{platform}"
  incomplete: "Index queries incomplete for %{platform}"
  offline: "Network disabled by ROSPM_NO_NETWORK"
  invalid: "Invalid repository index"
  unsupported: "Repository checking is unsupported for this configuration"
  pixi_unsupported: "Pixi channels are required; feature environments are not supported by this check"
  pixi_invalid: "Invalid pixi channels or dependency tables"

replacement:
  builtin: "apt[%{platform}]: %{from} -> %{to} (built-in mappings %{revision}); review target compatibility"
  manifest: "apt[%{platform}]: %{from} -> %{to} (manifest override); review target compatibility"

pixi:
  parse: "could not parse pixi.toml: %{source}"

cli:
  about: "Describe, lock and replay ROS 2 project environments"
  long_about: "rospm wraps rosdep, vcstool, colcon, apt, pixi and docker behind one manifest (rospm.toml) and one lock file (rospm.lock).\n\nCommands that modify the system (apply, uninstall, build, export, import, deps install) always print their plan first and accept --dry-run."
  manifest: "Path to rospm.toml (default: search upwards from the current directory)"
  json: "Machine-readable JSON output where supported"
  verbose: "Increase log verbosity (-v, -vv)"
  lang: "Output language: zh | en (overrides ROSPM_LANG and the locale)"
  help_flag: "Print help"
  version_flag: "Print version"
  dry_run: "Print the plan and exit"
  init:
    about: "Create a rospm.toml template in the current directory"
    distro: "ROS distribution for the template: humble | jazzy | rolling (default: Humble on Ubuntu 22.04, otherwise Jazzy; without --from-env)"
    from_env: "Draft the manifest from this host and directory (best effort; undetected fields are marked TODO)"
    base: "Which ROS metapackage to install: `ros-base` (bare bones, default) or `desktop` (adds RViz, demos, tutorials)"
    force: "Overwrite an existing rospm.toml"
    exists: "%{path} already exists (use --force to overwrite)"
    template_invalid: "internal error: template is invalid"
    draft_invalid: "internal error: drafted manifest is invalid"
    created: "created %{path}"
    created_from_env: "created %{path} from this host and directory"
    next_template: "next: edit the [workspaces] section and create main.repos, then run `rospm check`"
    next_review: "next: review the file, then run `rospm check`"
    next_todos_one: "next: resolve the 1 TODO line above (also marked in the file), then run `rospm check`"
    next_todos_many: "next: resolve the %{count} TODO lines above (also marked in the file), then run `rospm check`"
    detected: "detected    %{text}"
    todo: "TODO        %{text}"
  check:
    about: "Validate the manifest and compare it with this host (read-only)"
    target: "Evaluate platform overrides for this target instead of the host"
    strict: "Exit non-zero when the host does not match the manifest"
    platform_not_listed: "platform %{platform} is not listed in project.platforms"
    target_note: "Target repository indexes are checked for declared package names; versions and transitive dependencies are not solved"
    probing_skipped: "environment probing skipped: target %{target} differs from this host (%{host})"
    manifest_line: "manifest    %{path}"
    project_line: "project     %{name} (ROS %{distro}, provider %{provider})"
    platforms_line: "platforms   %{platforms}"
    build_order_line: "build order %{order}"
    apt_line: "apt[%{platform}]    %{packages}"
    pip_line: "pip (recorded only) %{packages}"
    note_line: "note        %{text}"
    valid_line: "ok          manifest is valid"
    env_header: "environment (%{platform}, expected vs actual)"
    ready: "ready       host matches the manifest"
    not_ready: "not ready   %{summary}; `rospm apply --dry-run` shows what would be installed, `rospm build --dry-run` what would be built"
    problems_one: "1 problem"
    problems_many: "%{count} problems"
    undetermined: "%{count} undetermined"
  status:
    ok: "ok"
    missing: "MISSING"
    mismatch: "MISMATCH"
    unknown: "unknown"
    info: "info"
  lock:
    about: "Resolve this host into rospm.lock: source revisions, apt versions, pip versions, snapshot dates (writes the project file; ROSPM_NO_NETWORK=1 skips snapshot discovery)"
    note_line: "note        %{text}"
    summary: "locked      %{platform}: %{sources} sources, %{apt} apt packages, %{pip} pip packages"
    other_platforms_kept: "kept        %{count} apt entries for other platforms from the previous lock"
    snapshots: "snapshots   ROS %{ros}, Ubuntu %{ubuntu}"
    live: "live (none, DEGRADED)"
    written: "written     %{path}"
    unchanged: "unchanged   %{path} already describes this state"
  verify:
    about: "Compare rospm.lock with the current environment (read-only)"
    no_lock: "no %{file} found; run `rospm lock` first"
    manifest_ok: "matches the lock"
    manifest_changed: "manifest changed since lock (run `rospm lock`)"
    manifest_line: "manifest    %{path}"
    lock_line: "lock        %{path}"
  apply:
    about: "Prepare declared Conda environments, set up the ROS apt source, install the ROS base, import sources and resolve dependencies [modifies system]"
    distro: "Select humble | jazzy | rolling and save it to the manifest (dry-run only previews)"
    locked_distro_conflict: "--locked cannot change the manifest distribution; run `rospm apply --distro <name>` first, then `rospm lock`"
    locked: "Honour rospm.lock (snapshot repositories, pinned revisions)"
    offline: "Use only bundled payloads, never the network"
    mirror: "Download ROS from this source set instead of probing and asking: official | tuna | ustc | aliyun (also `ROSPM_MIRROR`)"
    bad_mirror_env: "ROSPM_MIRROR: unknown mirror `%{value}` (expected one of: %{names})"
    not_probed: "network: not probed (%{reason}); planning with the %{name} sources (pass --mirror <name> to plan with a mirror)"
    official_failed_hint: "a step failed while using the official sources; `rospm doctor` shows which sources are reachable and `rospm apply --mirror <name>` retries from a mirror"
    network_check: "network check (%{count} URLs, %{secs} s timeout each)"
    git_host_unreachable: "warning: %{host} is not reachable; `vcs import` of the .repos sources will probably fail (rospm has no mirror for git hosts)"
    sources_line: "sources     %{name} (%{label})"
    official_forced: "warning: the official sources did not answer; continuing with them because --mirror official was requested"
    mirror_unreachable: "mirror `%{name}` did not answer on every endpoint it needs; pick another (--mirror %{names}) or --mirror official"
    official_unreachable: "official sources unreachable:"
    mirrors_answered: "mirrors that answered (fastest first): %{names}"
    need_mirror_flag: "the official ROS sources are unreachable from this host; re-run with `--mirror %{best}` (or %{names}) to install from a mirror, or `--mirror official` to try anyway"
    confirm_mirror: "use the %{name} mirror (%{label}) for the ROS apt source, ros.key and rosdep? [Y/n] "
    aborted: "aborted; re-run with `--mirror official` to try the official sources anyway, or `--mirror <name>` for a specific mirror"
    nothing_reachable: "neither the official ROS sources nor any known mirror answered (%{count} URLs failed, see the table above); check the network or proxy settings, or pass `--mirror official` to try anyway"
    role:
      ros_apt: "ROS apt"
      rosdistro: "rosdistro"
      git_host: "git host"
    locked_lock_missing: "no %{file}; run `rospm lock` first"
    locked_lock_stale: "%{file} does not match rospm.toml; run `rospm lock` again"
    checking_snapshot: "checking whether the locked snapshot is still online..."
    snapshot_unreachable_warn: "WARN: apt snapshot unreachable, falling back to version check"
  uninstall:
    about: "Remove the ROS installation described by the manifest; project files and workspaces are kept [modifies system]"
    keep_source: "Leave the ROS apt source and keyring in place"
    yes: "Do not ask for confirmation"
    nothing_to_do: "nothing to do"
    needs_confirmation: "refusing to uninstall without confirmation (pass --yes, or run interactively)"
    confirm: "proceed with the plan above? [y/N] "
    aborted: "aborted"
  build:
    about: "Build workspaces with colcon in overlay order [produces artifacts]"
    workspace: "Build only this workspace (its underlays must already be built)"
    conda_env: "Use this Conda environment name for this build, overriding build.conda (mutually exclusive with --conda-prefix)"
    conda_prefix: "Use this Conda prefix for this build (relative to the current directory), overriding build.conda (mutually exclusive with --conda-env)"
  env:
    about: "Print a script that enters the project environment (`source <(rospm env)`)"
    shell: "Shell syntax to emit: bash (default) | zsh"
  shell:
    about: "Start a subshell with the project environment loaded"
    entering: "entering rospm shell for `%{name}` (exit to leave)"
    start_failed: "failed to start bash"
    exited: "shell exited with %{status}"
  deps:
    about: "Inspect or complete dependencies from package.xml files"
    check: "Report missing dependencies without installing"
    install: "Install missing dependencies through rosdep [modifies system]"
    workspace_line: "workspace   %{name}    packages=%{packages}  keys=%{keys}"
    internal_line: "internal    %{keys}"
    external_line: "external    %{keys}"
    skipped_line: "skipped     %{keys}"
    none: "(none)"
    env_header: "environment (deps, expected vs actual)"
    env_empty: "(nothing to check)"
    ready: "ready        all external dependencies are installed"
    not_ready: "not ready    %{summary}; `rospm deps install --dry-run` shows what would be installed"
  export:
    about: "Produce an offline bundle (roadmap P6) [produces artifacts]"
    target: "Target platform of the bundle"
    output: "Where to write the bundle"
  import:
    about: "Verify and install an offline bundle (roadmap P6) [modifies system]"
    bundle: "Bundle produced by `rospm export`"
  editor:
    about: "Generate editor configuration (roadmap P7)"
    kind: "vscode | clion | devcontainer (default: all enabled in the manifest)"
  doctor:
    about: "Check that the wrapped tools are available on this machine"
    no_network: "Skip the network probe"
    network_header: "network       official sources and known mirrors (%{secs} s timeout each; `rospm apply --mirror <name>` switches)"
    network_skipped: "network       not probed (--no-network)"
    platform: "platform      %{value}"
    os: "os            %{value}"
    ros_installs: "ROS installs  %{value}"
    ros_apt_source: "ROS apt src   %{value}"
    universe: "apt universe  %{value}"
    locale_system: "sys locale    %{value}"
    locale_shell: "shell locale  %{value}"
    rosdep: "rosdep        init: %{init}  update: %{update}"
    unknown: "unknown"
    no_ros: "none found under /opt/ros"
    source_not_configured: "not configured (`rospm apply` adds it)"
    universe_not_enabled: "not enabled"
    not_utf8: "%{value} in %{file}: not UTF-8 (ROS needs a UTF-8 locale; `rospm apply` sets LANG=en_US.UTF-8 there)"
    locale_no_file: "no %{file}; `rospm apply` goes by the shell locale instead"
    shell_not_utf8: "%{value}: not UTF-8 (not changed by `rospm apply`; `export LANG=<a UTF-8 locale>` before running ROS tools)"
    done: "done"
    not_run: "not run"
    not_found: "not found"
    core_missing: "core tools missing: native provider needs %{tools}"
  help:
    about: "Print this message or the help of the given subcommand"
    command: "Subcommand to describe (e.g. `deps install`)"
    unknown: "unknown command `%{command}` (see `rospm --help`)"
  err:
    no_cwd: "cannot determine current directory"
    manifest_not_found: "no %{file} found in %{dir} or any parent directory (run `rospm init`)"
    cannot_resolve: "cannot resolve %{path}"
    cannot_write: "cannot write %{path}"
    cannot_read: "cannot read %{path}"
    unsupported_host: "this host is not a supported platform (expected linux x86_64 or aarch64)"
    prefix: "error: %{text}"

help:
  usage: "Usage:"
  commands: "Commands:"
  arguments: "Arguments:"
  options: "Options:"

template:
  ros_base_comment: "ros-base (bare bones) | desktop (adds RViz, demos)"

error:
  io: "I/O error on %{path}: %{source}"
  manifest_parse: "failed to parse manifest %{path}: %{source}"
  lock_parse: "failed to parse lock file %{path}: %{source}"
  repos_parse: "failed to parse vcstool repos file %{path}: %{source}"
  package_xml: "failed to parse %{path}: %{message}"
  serialize: "failed to serialize %{what}: %{source}"
  schema_version: "unsupported schema_version %{found} (this rospm supports %{supported})"
  validation: "manifest validation failed:\n%{list}"
  unknown_workspace: "unknown workspace `%{name}`"
  not_implemented: "%{feature} is not implemented yet (planned for roadmap %{phase})"
  command_failed: "command failed: %{command} (%{status})"

package_xml:
  malformed: "malformed XML: %{source}"
  root_element: "root element is <%{found}>, expected <package>"
  missing_name: "missing <name>"

