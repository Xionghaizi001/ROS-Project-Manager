# rospm 项目清单 —— 每个字段的说明见 docs/spec.md。
schema_version = 1

[project]
name = "@NAME@"
ros_distro = "@DISTRO@"                     # humble | jazzy | rolling
platforms = ["linux-x86_64"]             # ARM 目标请加上 "linux-aarch64"

[environment]
provider = "native"                      # native | pixi | docker

[environment.native]
# ubuntu = "@UBUNTU@"                       # 默认为该发行版对应的 Ubuntu 版本
# ros_base = "ros-@DISTRO@-ros-base"        # 或 ros-@DISTRO@-desktop；`rospm init --base desktop` 会设置它

# 可选：为所有 workspace 的构建选择已有 Conda 环境（native）。
# [build.conda]
# name = "robot-dev"                     # name 与 prefix 二选一，不能同时设置
# prefix = ".conda/robot-dev"             # 相对于此清单
# 单次覆盖：rospm build --conda-env other / --conda-prefix /path/to/env
# 或用以下受管环境替换 name/prefix（由 `apply` 准备）：
# [build.conda.managed]
# python = "3.12"                        # Jazzy 示例；须与 ROS 的 Python ABI 匹配
# channels = ["conda-forge"]
# environment_file = "environment.yml"   # 可选；相对于清单目录
# lock_file = "conda.lock"               # 可选引用；精确重放尚未实现

[workspaces.main]
path = "ws"
sources = "main.repos"                   # vcstool .repos 文件（TODO：需要创建）
underlays = []

[workspaces.main.colcon]
build_args = ["--symlink-install"]

[dependencies]
apt = []                                 # package.xml 未覆盖的额外 apt 包
pip = []                                 # 仅记录，通过 rosdep 安装

[dependencies.rosdep]
enabled = true
skip_keys = []

[env]
ROS_DOMAIN_ID = "0"
