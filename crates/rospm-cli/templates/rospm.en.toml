# rospm project manifest — see docs/spec.md for every field.
schema_version = 1

[project]
name = "@NAME@"
ros_distro = "@DISTRO@"                     # humble | jazzy | rolling
platforms = ["linux-x86_64"]             # add "linux-aarch64" for ARM targets

[environment]
provider = "native"                      # native | pixi | docker

[environment.native]
# ubuntu = "@UBUNTU@"                       # defaults to the distro's release
# ros_base = "ros-@DISTRO@-ros-base"        # or ros-@DISTRO@-desktop; `rospm init --base desktop` sets it

# Optional: select an existing Conda environment for all workspace builds (native).
# [build.conda]
# name = "robot-dev"                     # choose name OR prefix, never both
# prefix = ".conda/robot-dev"             # relative to this manifest
# Override once: rospm build --conda-env other / --conda-prefix /path/to/env

[workspaces.main]
path = "ws"
sources = "main.repos"                   # vcstool .repos file (TODO: create it)
underlays = []

[workspaces.main.colcon]
build_args = ["--symlink-install"]

[dependencies]
apt = []                                 # extra apt packages not in any package.xml
pip = []                                 # recorded only, installed via rosdep

[dependencies.rosdep]
enabled = true
skip_keys = []

[env]
ROS_DOMAIN_ID = "0"
