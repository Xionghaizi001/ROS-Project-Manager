name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p rospm-cli
      - uses: actions/upload-artifact@v4
        with:
          name: rospm-${{ matrix.os }}
          path: target/release/rospm

  # Smoke: the binary runs on a bare Ubuntu 22.04 (Humble host) and 24.04 (Jazzy host)
  # without any ROS installed — check/doctor must not require ROS to be present.
  # Each image gets the manifest for its own release: `apply` refuses a
  # manifest whose Ubuntu release does not match the host.
  smoke:
    needs: test
    strategy:
      matrix:
        include:
          - image: "ubuntu:22.04"
            manifest: examples/minimal-humble/rospm.toml
          - image: "ubuntu:24.04"
            manifest: examples/minimal/rospm.toml
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rospm-ubuntu-24.04
          path: bin
      - run: chmod +x bin/rospm
      - run: bin/rospm --version
      - run: bin/rospm --manifest ${{ matrix.manifest }} check
      - run: mkdir -p /tmp/scratch/ws/src && cd /tmp/scratch && $GITHUB_WORKSPACE/bin/rospm init --from-env --base desktop && $GITHUB_WORKSPACE/bin/rospm check --json
      # A bare container has no ROS apt source: the plan must bootstrap it before the base install.
      # The locale step, when planned, sets LANG only: LC_ALL would pin every category system-wide.
      - run: bin/rospm --manifest ${{ matrix.manifest }} apply --dry-run | tee /tmp/apply.txt && grep -q 'write /etc/apt/sources.list.d/ros2.list (sudo)' /tmp/apply.txt && ! grep -q 'LC_ALL=' /tmp/apply.txt
      - run: bin/rospm --manifest ${{ matrix.manifest }} uninstall --dry-run
      - run: bin/rospm --manifest ${{ matrix.manifest }} build --dry-run
      - run: bin/rospm --manifest ${{ matrix.manifest }} env
      - run: bin/rospm doctor --json || true   # tools are absent here; report only
      # P2: deps / lock / verify on a bare container. Sources are not imported,
      # so `lock` must refuse (a lock describes a resolved state) and `verify`
      # must ask for one; neither may touch the network or the system.
      - run: bin/rospm --manifest ${{ matrix.manifest }} deps check --json | grep -q '"external"'
      - run: bin/rospm --manifest ${{ matrix.manifest }} deps install --dry-run | grep -q 'dry-run: nothing executed'
      - run: "! ROSPM_NO_NETWORK=1 bin/rospm --manifest ${{ matrix.manifest }} lock 2> /tmp/lock.txt; grep -q 'not imported' /tmp/lock.txt"
      - run: "! bin/rospm --manifest ${{ matrix.manifest }} verify 2> /tmp/verify.txt; grep -q 'rospm lock' /tmp/verify.txt"
      # i18n (P1.5): the other Chinese output is covered by cargo test; only the
      # ros2.list line needs a bare system to be planned. The runner's own
      # locale is C, which the English steps above rely on.
      - run: LANG=zh_CN.UTF-8 bin/rospm --manifest ${{ matrix.manifest }} apply --dry-run | tee /tmp/apply-zh.txt && grep -q '写入 /etc/apt/sources.list.d/ros2.list（sudo）' /tmp/apply-zh.txt && grep -q '未执行任何步骤' /tmp/apply-zh.txt
