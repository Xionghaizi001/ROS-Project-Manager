[workspace]
resolver = "2"
members = ["crates/rospm-core", "crates/rospm-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Describe, lock and replay ROS 2 project environments"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
sha2 = "0.10"
serde_yaml = "0.9"
roxmltree = "0.20"
rust-i18n = "4"

[profile.release]
lto = true
codegen-units = 1
strip = true
