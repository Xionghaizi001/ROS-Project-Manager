schema_version = 1
[project]
name = "p3_native"
ros_distro = "jazzy"
platforms = ["linux-x86_64", "linux-aarch64"]
[environment]
provider = "native"
[environment.native]
ubuntu = "24.04"
ros_base = "ros-jazzy-ros-base"
[workspaces.main]
path = "ws"
sources = "main.repos"
[workspaces.main.colcon]
build_args = ["--executor", "sequential", "--parallel-workers", "1"]
[dependencies]
apt = ["binutils-x86-64-linux-gnu"]
[dependencies.rosdep]
enabled = true
